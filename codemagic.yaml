workflows:
  ios-unsigned:
    name: Nx — unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        XCODE_SCHEME: "3105"
        # Fallback only; normal operation reads source/license-config.json remotely.
        LICENSE_VALIDATION_BASE_URL: "https://keyauth.discloud.dev"
    scripts:
      - name: Locate source and build unsigned archive
        script: |
          set -euo pipefail
          SOURCE_DIR="$CM_BUILD_DIR"
          if [ ! -d "$SOURCE_DIR/$XCODE_PROJECT" ]; then
            ZIP=""
            for candidate in \
              "$CM_BUILD_DIR/NX-CHEATS-source-updated.zip" \
              "$CM_BUILD_DIR/NX-CHEATS-source-flat.zip" \
              "$CM_BUILD_DIR/3105-source.zip"; do
              if [ -f "$candidate" ]; then ZIP="$candidate"; break; fi
            done
            if [ -z "$ZIP" ]; then
              ZIP="$(find "$CM_BUILD_DIR" -maxdepth 2 -type f -name '*.zip' -print -quit || true)"
            fi
            if [ -z "$ZIP" ]; then
              echo "ERRO: nenhum ZIP de código-fonte foi encontrado em $CM_BUILD_DIR"
              find "$CM_BUILD_DIR" -maxdepth 2 -type f -print
              exit 1
            fi
            rm -rf "$CM_BUILD_DIR/workspace"
            mkdir -p "$CM_BUILD_DIR/workspace"
            echo "Extraindo código-fonte: $ZIP"
            unzip -q "$ZIP" -d "$CM_BUILD_DIR/workspace"
            PROJECT_PATH="$(find "$CM_BUILD_DIR/workspace" -type d -name "$XCODE_PROJECT" -print -quit || true)"
            if [ -z "$PROJECT_PATH" ]; then
              echo "ERRO: $XCODE_PROJECT não foi encontrado dentro de $ZIP"
              find "$CM_BUILD_DIR/workspace" -maxdepth 4 -print
              exit 1
            fi
            SOURCE_DIR="$(dirname "$PROJECT_PATH")"
          fi
          echo "Projeto Xcode: $SOURCE_DIR/$XCODE_PROJECT"
          test -d "$SOURCE_DIR/$XCODE_PROJECT"
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          xcodebuild archive -project "$SOURCE_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -archivePath "$CM_BUILD_DIR/build/3105.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO LICENSE_VALIDATION_BASE_URL="$LICENSE_VALIDATION_BASE_URL"
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="$(find "$CM_BUILD_DIR/build/3105.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)"
          test -n "$APP_PATH"
          rm -rf "$CM_BUILD_DIR/build/unsigned-ipa"
          mkdir -p "$CM_BUILD_DIR/build/unsigned-ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/unsigned-ipa/Payload/"
          cd "$CM_BUILD_DIR/build/unsigned-ipa"
          zip -qry "$CM_BUILD_DIR/build/ios/ipa/3105-unsigned.ipa" Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - build/3105.xcarchive/**
      - /tmp/xcodebuild_logs/*.log
